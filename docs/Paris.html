  <style>
    /* CSS Styles */
    
    /* Import Google Fonts */
    @import url('https://fonts.googleapis.com/css2?family=Roboto&display=swap');
    
    /* Global Styles */
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }
    
    /* Gallery Styles */
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      padding: 50px;
    }
    
    /* Map Styles */
    iframe {
      width: 100%;
      height: 450px;
      border: none;
    }
    
    /* Attractions Styles */
    .attraction {
      width: 25%;
      margin: 20px;
      padding: 20px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }
    
    /* Attractions List Styles */
    .attractions-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    /* Carousel Styles */
    .carousel {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    
    /* Header Styles */
    .header {
      display: flex;
      align-items: center;
      background-color: #f3f3f3;
      padding: 50px;
    }
    
    /* Footer Styles */
    .footer {
      display: flex;
      align-items: center;
      background-color: #f3f3f3;
      padding: 50px;
    }
    
    /* Carousel Styles */
    .carousel-item {
      width: 200px;

    }
